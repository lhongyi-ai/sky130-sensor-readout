<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SKY130 可编程模拟前端信号路径</title>
  <desc id="desc">差分传感器输入经过全差分误差放大器、可切换电阻反馈、输出驱动和实际采样开关进入 SAR ADC；偏置启动和共模反馈控制放大器。</desc>
  <style>.box{fill:#f7f9fc;stroke:#315b7d;stroke-width:2;rx:12}.warn{fill:#fff5e8;stroke:#b55d00;stroke-width:2;rx:12}.ok{fill:#eef8f1;stroke:#287447;stroke-width:2;rx:12}.line{stroke:#293947;stroke-width:3;fill:none;marker-end:url(#a)}.feedback{stroke:#6b4aa0;stroke-width:2.5;fill:none;marker-end:url(#b)}.label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17232d}.small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374955}.status{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8a3e00}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#293947"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b4aa0"/></marker></defs>
  <text x="40" y="42" class="label" font-size="25">SKY130 可编程模拟前端（当前为未冻结的开源 SPICE 设计）</text>
  <rect x="35" y="145" width="165" height="100" class="box"/><text x="118" y="180" text-anchor="middle" class="label">差分传感器</text><text x="118" y="207" text-anchor="middle" class="small">VINP / VINN</text><text x="118" y="229" text-anchor="middle" class="small">0 / 350 Ω / 1 kΩ</text>
  <rect x="260" y="125" width="220" height="140" class="warn"/><text x="370" y="162" text-anchor="middle" class="label">全差分两级放大器</text><text x="370" y="190" text-anchor="middle" class="small">误差对 + 输出级</text><text x="370" y="214" text-anchor="middle" class="small">片内偏置与启动</text><text x="370" y="240" text-anchor="middle" class="status">三档与跨 PVT 尚未通过</text>
  <rect x="545" y="125" width="210" height="140" class="box"/><text x="650" y="162" text-anchor="middle" class="label">可切换电阻反馈</text><text x="650" y="190" text-anchor="middle" class="small">增益 1 / 4 / 16</text><text x="650" y="214" text-anchor="middle" class="small">真实 PDK 电阻与 TG</text><text x="650" y="240" text-anchor="middle" class="small">转换启动时锁存选择</text>
  <rect x="820" y="125" width="170" height="140" class="box"/><text x="905" y="162" text-anchor="middle" class="label">ADC 驱动网络</text><text x="905" y="190" text-anchor="middle" class="small">RISO + MIM C</text><text x="905" y="214" text-anchor="middle" class="small">隔离回踢</text><text x="905" y="240" text-anchor="middle" class="small">建立时间检查</text>
  <rect x="1040" y="145" width="125" height="100" class="box"/><text x="1102" y="181" text-anchor="middle" class="label">SAR ADC</text><text x="1102" y="208" text-anchor="middle" class="small">81.285 pF/端</text><text x="1102" y="231" text-anchor="middle" class="small">12 bit</text>
  <path d="M200 195 H260" class="line"/><path d="M480 195 H545" class="line"/><path d="M755 195 H820" class="line"/><path d="M990 195 H1040" class="line"/>
  <path d="M650 270 V340 H370 V272" class="feedback"/><text x="620" y="366" text-anchor="middle" class="small">差模反馈决定闭环增益</text>
  <rect x="260" y="320" width="220" height="72" class="ok"/><text x="370" y="349" text-anchor="middle" class="label">连续时间共模反馈</text><text x="370" y="375" text-anchor="middle" class="small">把输出平均值拉回 VCM</text>
</svg>
