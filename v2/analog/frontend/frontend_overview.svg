<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SKY130 Programmable Analog Frontend Signal Path</title>
  <desc id="desc">The differential sensor input passes through a fully differential error amplifier, switchable resistive feedback, output drive, and physical sampling switches into the SAR ADC. Bias startup and common-mode feedback control the amplifier.</desc>
  <style>.box{fill:#f7f9fc;stroke:#315b7d;stroke-width:2;rx:12}.warn{fill:#fff5e8;stroke:#b55d00;stroke-width:2;rx:12}.ok{fill:#eef8f1;stroke:#287447;stroke-width:2;rx:12}.line{stroke:#293947;stroke-width:3;fill:none;marker-end:url(#a)}.feedback{stroke:#6b4aa0;stroke-width:2.5;fill:none;marker-end:url(#b)}.label{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17232d}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374955}.status{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8a3e00}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#293947"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b4aa0"/></marker></defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="40" y="42" class="label" style="font-size:22px">SKY130 Programmable Analog Frontend — Unfrozen Open-Source SPICE Design</text>
  <rect x="35" y="145" width="165" height="100" class="box"/><text x="118" y="180" text-anchor="middle" class="label">Differential sensor</text><text x="118" y="207" text-anchor="middle" class="small">VINP / VINN</text><text x="118" y="229" text-anchor="middle" class="small">0 / 350 Ω / 1 kΩ</text>
  <rect x="260" y="125" width="220" height="140" class="warn"/><text x="370" y="162" text-anchor="middle" class="label">Two-stage fully diff. amp</text><text x="370" y="190" text-anchor="middle" class="small">Error pair + output stage</text><text x="370" y="214" text-anchor="middle" class="small">On-chip bias and startup</text><text x="370" y="240" text-anchor="middle" class="status">3 gains / PVT not qualified</text>
  <rect x="545" y="125" width="210" height="140" class="box"/><text x="650" y="162" text-anchor="middle" class="label">Switchable resistive FB</text><text x="650" y="190" text-anchor="middle" class="small">Gain 1 / 4 / 16</text><text x="650" y="214" text-anchor="middle" class="small">Physical PDK resistors + TGs</text><text x="650" y="240" text-anchor="middle" class="small">Selection latched at start</text>
  <rect x="820" y="125" width="170" height="140" class="box"/><text x="905" y="162" text-anchor="middle" class="label">ADC drive network</text><text x="905" y="190" text-anchor="middle" class="small">RISO + MIM C</text><text x="905" y="214" text-anchor="middle" class="small">Kickback isolation</text><text x="905" y="240" text-anchor="middle" class="small">Settling-time checks</text>
  <rect x="1040" y="145" width="125" height="100" class="box"/><text x="1102" y="181" text-anchor="middle" class="label">SAR ADC</text><text x="1102" y="208" text-anchor="middle" class="small">81.285 pF/side</text><text x="1102" y="231" text-anchor="middle" class="small">12 bit</text>
  <path d="M200 195 H260" class="line"/><path d="M480 195 H545" class="line"/><path d="M755 195 H820" class="line"/><path d="M990 195 H1040" class="line"/>
  <path d="M650 270 V340 H370 V272" class="feedback"/><text x="620" y="366" text-anchor="middle" class="small">Differential feedback sets closed-loop gain</text>
  <rect x="260" y="320" width="220" height="72" class="ok"/><text x="370" y="349" text-anchor="middle" class="label">Continuous-time CMFB</text><text x="370" y="375" text-anchor="middle" class="small">Regulates mean output to VCM</text>
</svg>
