<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:16}
      .pass{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}
      .fail{fill:#fff1f2;stroke:#e11d48;stroke-width:2;rx:16}
      .wire{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .title{font-size:25px;font-weight:700}.head{font-size:16px;font-weight:650}.body{font-size:14px}.small{font-size:12px;fill:#475569}
    </style>
  </defs>
  <rect width="1280" height="620" fill="#ffffff"/>
  <text x="54" y="50" class="title">2026-09-11 Fully Differential Inverting Frontend: Static Pass, Dynamic Closure Pending</text>

  <rect x="50" y="135" width="185" height="150" class="box"/>
  <text x="75" y="174" class="head">Differential sensor</text>
  <text x="75" y="207" class="body">VINP / VINN</text>
  <text x="75" y="236" class="body">350 Ω source per side</text>
  <text x="75" y="264" class="small">DC–5 kHz</text>

  <rect x="300" y="120" width="220" height="180" class="box"/>
  <text x="330" y="158" class="head">Switched resistor sum</text>
  <text x="330" y="191" class="body">Rin = 10 kΩ</text>
  <text x="330" y="220" class="body">Rf = 10.35 / 41.4</text>
  <text x="330" y="246" class="body">/ 165.6 kΩ</text>
  <text x="330" y="276" class="small">Physical high-R poly + TGs</text>

  <rect x="590" y="105" width="250" height="210" class="pass"/>
  <text x="622" y="146" class="head">Two-stage fully diff. OTA</text>
  <text x="622" y="181" class="body">NMOS differential input</text>
  <text x="622" y="210" class="body">PMOS common-source output</text>
  <text x="622" y="239" class="body">First-stage node CM loop</text>
  <text x="622" y="268" class="body">Continuous output CMFB</text>
  <text x="622" y="298" class="small">Same-source TT static pass: 3 gains</text>

  <rect x="915" y="135" width="285" height="150" class="fail"/>
  <text x="946" y="174" class="head">Filter + physical SAR load</text>
  <text x="946" y="207" class="body">4 pF + isolation resistor</text>
  <text x="946" y="236" class="body">Four-MOS switch</text>
  <text x="946" y="264" class="small">4096 MIM units/side: dynamic fail</text>

  <path d="M235 210 H300" class="wire"/>
  <path d="M520 210 H590" class="wire"/>
  <path d="M840 210 H915" class="wire"/>
  <path d="M715 315 V382 H410 V302" class="dash"/>
  <text x="425" y="405" class="small">Cross-coupled negative feedback: OUTN→SUMPOS, OUTP→SUMNEG</text>

  <rect x="70" y="430" width="340" height="125" class="pass"/>
  <text x="98" y="469" class="head">Verified</text>
  <text x="98" y="500" class="body">81 points × 3 gains; residual ≤ 0.1173 LSB</text>
  <text x="98" y="529" class="body">Maximum frontend DC power ≈ 0.535 mW</text>

  <rect x="470" y="430" width="355" height="125" class="fail"/>
  <text x="498" y="469" class="head">Not qualified</text>
  <text x="498" y="500" class="body">4.80–14.47 mV ringing in reference window</text>
  <text x="498" y="529" class="body">Formal DM/CM phase margins unmeasured</text>

  <rect x="885" y="430" width="325" height="125" class="fail"/>
  <text x="913" y="469" class="head">Stop condition</text>
  <text x="913" y="500" class="body">Dynamic prerequisite failed; 45-PVT not run</text>
  <text x="913" y="529" class="body">1.2 kΩ nulling resistor below minimum length</text>
</svg>
