<text fill="#88dd00"  xml:space="preserve" font-size="40.451" transform="translate(68.9676, 60.7295)" >SWITCHABLE PGA - FULLY DIFFERENTIAL CROSS-FEEDBACK</text>
<text fill="#88dd00"  xml:space="preserve" font-size="19.161" transform="translate(68.9676, 107.93)" >ONE OTA AND ONE SUMMING-NODE PAIR; ONLY THE PHYSICAL FEEDBACK BRANCH CHANGES</text>
<text fill="#88dd00"  xml:space="preserve" font-size="15.4353" transform="translate(68.9676, 160.842)" >BOUND TO candidate_06.spice | NOT CADENCE | FORMAL MULTILOOP STABILITY OPEN</text>
<text fill="#88dd00"  xml:space="preserve" font-size="17.032" transform="translate(331.216, 269.766)" >UPPER FEEDBACK BANK: OUTN -&gt; SUMPOS</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.1773" transform="translate(135.499, 325.863)" >MODE / RESISTANCE</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.1773" transform="translate(468.155, 325.863)" >PHYSICAL RESISTOR + TRANSMISSION GATE</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.1773" transform="translate(811.048, 325.863)" >SELECT</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(135.499, 397.996)" >1x   RFB = 10.35 kohm</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(135.499, 469.645)" >4x   RFB = 41.4 kohm</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(135.499, 541.294)" >16x  RFB = 165.6 kohm</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.1773" transform="translate(811.048, 397.512)" >E1 / E1B</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.1773" transform="translate(811.048, 469.161)" >E4 / E4B</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.1773" transform="translate(811.048, 540.811)" >E16 / E16B</text>
<text fill="#88dd00"  xml:space="preserve" font-size="17.032" transform="translate(327.716, 1134.67)" >LOWER FEEDBACK BANK: OUTP -&gt; SUMNEG</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.1773" transform="translate(135.499, 1190.77)" >MODE / RESISTANCE</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.1773" transform="translate(468.155, 1190.77)" >PHYSICAL RESISTOR + TRANSMISSION GATE</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.1773" transform="translate(811.048, 1190.77)" >SELECT</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(135.499, 1262.9)" >1x   RFB = 10.35 kohm</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(135.499, 1334.55)" >4x   RFB = 41.4 kohm</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(135.499, 1406.2)" >16x  RFB = 165.6 kohm</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.1773" transform="translate(811.048, 1262.42)" >E1 / E1B</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.1773" transform="translate(811.048, 1334.07)" >E4 / E4B</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.1773" transform="translate(811.048, 1405.72)" >E16 / E16B</text>
<text fill="#88dd00"  xml:space="preserve" font-size="17.5643" transform="translate(682.019, 689.908)" >MAIN DIFFERENTIAL SIGNAL PATH</text>
<text fill="#88dd00"  xml:space="preserve" font-size="12.774" transform="translate(115.028, 767.443)" >VINP</text>
<text fill="#88dd00"  xml:space="preserve" font-size="10.645" transform="translate(224.65, 719.45)" >10-kohm INPUT RESISTOR</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.7095" transform="translate(766.076, 766.477)" >SUMPOS</text>
<text fill="#88dd00"  xml:space="preserve" font-size="12.774" transform="translate(115.028, 920.977)" >VINN</text>
<text fill="#88dd00"  xml:space="preserve" font-size="10.645" transform="translate(224.65, 872.984)" >10-kohm INPUT RESISTOR</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.7095" transform="translate(765.076, 920.011)" >SUMNEG</text>
<text fill="#88dd00"  xml:space="preserve" font-size="21.29" transform="translate(1108.72, 759.822)" >RD_FDOTA</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.2418" transform="translate(1091.72, 848.845)" >two inputs / two outputs</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.2418" transform="translate(1070.72, 889.787)" >two stages + continuous CMFB</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.1773" transform="translate(1089.72, 960.47)" >DETAIL PAGE: rd_fdota.sch</text>
<text fill="#88dd00"  xml:space="preserve" font-size="12.774" transform="translate(1423.04, 767.443)" >OUTP</text>
<text fill="#88dd00"  xml:space="preserve" font-size="12.774" transform="translate(1422.04, 920.977)" >OUTN</text>
<text fill="#88dd00"  xml:space="preserve" font-size="19.161" transform="translate(1864.88, 281.935)" >REAL CMOS GAIN DECODER</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.2418" transform="translate(1706.66, 347.301)" >XI0 / XI1: inverters</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.2418" transform="translate(1706.66, 398.479)" >XN1 / XN4 / XN16: NAND gates</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.2418" transform="translate(1706.66, 449.657)" >XIE1 / XIE4 / XIE16: inverters</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.2418" transform="translate(1706.66, 521.306)" >SEL1:SEL0 = 00 -&gt; E1</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.2418" transform="translate(1706.66, 572.484)" >01 -&gt; E4   |   10 -&gt; E16   |   11 -&gt; none</text>
<text fill="#88dd00"  xml:space="preserve" font-size="18.0965" transform="translate(1862.88, 746.687)" >WHY THE 1x MODE IS USEFUL</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 812.537)" >It converts the sensor signal to a full-differential pair.</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 863.715)" >It controls output common mode and lowers output impedance.</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 914.893)" >It also isolates and drives the switched SAR input load.</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 986.542)" >A voltage gain of one is still active signal conditioning.</text>
<text fill="#88dd00"  xml:space="preserve" font-size="18.0965" transform="translate(1911.38, 1176.58)" >CANDIDATE TRUTH</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 1237.31)" >All three nominal static modes pass.</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 1283.37)" >All three real-load dynamic modes pass.</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 1329.43)" >Formal multiloop stability is not closed.</text>
<text fill="#cccccc"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 1375.49)" >45-PVT and noise are not qualified.</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.7095" transform="translate(1706.66, 1421.55)" >This drawing is not a full qualification claim.</text>
<text fill="#88dd00"  xml:space="preserve" font-size="11.7095" transform="translate(68.9676, 1529.03)" >AUTHORITATIVE SOURCE: ../dynamic_20260911/candidate_06.spice | AUDIT: artifact_manifest.json</text>
